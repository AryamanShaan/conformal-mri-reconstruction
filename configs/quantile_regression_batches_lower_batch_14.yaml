# =============================================================================
# Quantile U-Net training -- LOWER bound (q=0.05), batch_14 settings.
# Run inside conformal-mri-reconstruction on top of a VarNet trained in THIS repo.
# Consumed by quantile/train_quantile_regression.py via --config.
# =============================================================================

data_path: /gpfs/scratch/shaana01/knee_fastmri_cp
# Fresh output dir (NOT the old fastMRI quantile_0.05_batches_14) so the trainer
# does not auto-resume an old last.ckpt. See train_quantile_regression.py auto-resume.
default_root_dir: /gpfs/scratch/shaana01/conformal-mri-reconstruction-logs/quantile_model_runs/quantile_0.05_cmr_batch_14

num_gpus: 4
batch_size: 1
num_workers: 4

challenge: multicoil
max_epochs: 50
seed: 42
deterministic: True

# VarNet backbone trained in conformal-mri-reconstruction (e2evarnet runner).
# Loaded via e2evarnet.VarNet_module.VarNetModule.load_from_checkpoint(...).varnet
# -- works directly because the e2evarnet runner saved it with that same module.
# Point at whichever run you want the bounds built on:
#   run_6 = train-only (held-out val); run_2 = completed leaderboard-mode run.
# varnet_checkpoint: /gpfs/scratch/shaana01/conformal-mri-reconstruction-logs/varnet_runs/run_6/e2e_varnet/checkpoints/e2e_knee_rvds/last.ckpt
varnet_checkpoint: /gpfs/scratch/shaana01/conformal-mri-reconstruction-logs/varnet_runs/run_6/e2e_varnet/checkpoints/e2e_knee_rvds/epoch=58-step=512474.ckpt

quantile: 0.05
pinball_loss_type: original

model_type: QuantileBoundOriginalUnet
output_version: v1
unet_chans: 32
unet_pools: 4
unet_drop_prob: 0.0

lr: 0.0003
lr_step_size: 40
lr_gamma: 0.1
weight_decay: 0.0

mask_type: random_vds
min_k_fraction: 0.05
max_k_fraction: 0.50
center_fractions: [0.08]
accelerations: [4]
